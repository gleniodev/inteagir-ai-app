server {
    listen 80;
    listen [::]:80;
    server_name inteagir.ai.glennscode.com;
    location /.well-known/acme-challenge/ { root /var/www/inteagir-ai-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inteagir.ai.glennscode.com;
    ssl_certificate /etc/letsencrypt/live/inteagir.ai.glennscode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inteagir.ai.glennscode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
